  version: 1.0.0
  description: MVP de uma única barbearia. JSON, JWT e horários America/Sao_Paulo.
paths:
  /api/v1/admin/appointments:
    get:
      operationId: admin_appointments_list
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Data local YYYY-MM-DD.
      - in: query
        name: from
        schema:
          type: string
        description: Data inicial inclusiva YYYY-MM-DD.
      - in: query
        name: professional
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelado
          - concluido
          - confirmado
          - pendente
      - in: query
        name: to
        schema:
          type: string
        description: Data final inclusiva YYYY-MM-DD.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agendamento'
          description: ''
