<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prumo | Agenda do barbeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/agenda.css" />
</head>
<body>
  <header class="topo">
    <span class="marca">PRUMO</span>
    <a href="../index.html" class="sair">Sair</a>
  </header>

  <main class="agenda">
    <h1>Minha agenda</h1>
    <p class="subtitulo">Acompanhe seus atendimentos sem interromper o trabalho.</p>

    <div class="resumo">
      <div><strong id="n-confirmado">0</strong><span>Confirmados</span></div>
      <div><strong id="n-finalizado">0</strong><span>Finalizados</span></div>
      <div><strong id="n-cancelado">0</strong><span>Cancelados</span></div>
    </div>

    <div class="abas">
      <button class="btn ativo" data-visao="hoje">Hoje</button>
      <button class="btn" data-visao="semana">Semana</button>
    </div>

    <section id="lista"></section>
  </main>

  <script src="../js/agenda.js"></script>
</body>
</html>
