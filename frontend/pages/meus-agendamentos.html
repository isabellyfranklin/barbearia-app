<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="api-url" content="">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prumo | Meus agendamentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/agenda.css" />
</head>
<body>
  <header class="topo">
    <span class="marca">PRUMO</span>
    <nav class="nav-topo">
      <a href="home.html">Início</a>
      <a href="meus-agendamentos.html" class="atual">Meus agendamentos</a>
      <a href="perfil.html">Meu perfil</a>
      <a href="../index.html" class="sair">Sair</a>
    </nav>
  </header>

  <main class="agenda">
    <h1>Meus agendamentos</h1>
    <p class="subtitulo">Acompanhe suas reservas e cancele se precisar.</p>

    <div class="abas">
      <button type="button" class="btn ativo" data-visao="proximos">Próximos</button>
      <button type="button" class="btn" data-visao="historico">Histórico</button>
      <a href="agendamento.html" class="btn primario" style="margin-left: auto; text-decoration: none">Novo agendamento</a>
    </div>

    <form id="filtros" class="filtros" hidden>
      <label>Status
        <select id="f-status">
          <option value="">Todos</option>
          <option value="pendente">Pendente</option>
          <option value="confirmado">Confirmado</option>
          <option value="concluido">Finalizado</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </label>
      <label>De <input type="date" id="f-de" /></label>
      <label>Até <input type="date" id="f-ate" /></label>
      <button type="submit" class="btn">Filtrar</button>
    </form>

    <section id="lista"></section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/meus-agendamentos.js"></script>
</body>
</html>
